name = "voice-aura-api"
main = "src/worker.js"
compatibility_date = "2026-10-01"

# 静态资源：本地 `wrangler dev` 与 workers.dev 域名都能直接打开前端
# 静态文件直接命中；/api/* 走 Worker 逻辑
[assets]
directory = "../web"
binding = "ASSETS"

[vars]
MODEL = "qwen3.8-omni-flash"
# 允许跨域调用 API 的来源（部署 GitHub Pages 后把 pages 域名加进来，逗号分隔）
ALLOWED_ORIGINS = "http://127.0.0.1:8787,http://localhost:8787,https://chenjianancodex.github.io"
